spring:
  application:
    name: avigem-diagnostics

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/avigem_diagnostics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8085}
  shutdown: graceful
  servlet:
    context-path: /

logging:
  level:
    com.avigem: INFO
    org.flywaydb: INFO

diagnostics:
  auth:
    validation-url: ${LARAVEL_AUTH_VALIDATION_URL:}
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    broker-uri: ${MQTT_BROKER_URI:tcp://127.0.0.1:1883}
    client-id: ${MQTT_CLIENT_ID:avigem-diagnostics}
    topic: ${MQTT_TOPIC:avigem/devices/+/imu}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    qos: ${MQTT_QOS:1}
